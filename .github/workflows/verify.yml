name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_AUTH_BASE_URL: https://auth.example.invalid/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-build-value-not-a-real-secret-0000000000
      NEXT_PUBLIC_SITE_URL: https://auspice-red.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Verify public HTML and SEO
        run: |
          npm start -- --hostname 127.0.0.1 --port 3100 >/tmp/auspice-web.log 2>&1 &
          auspice_server_pid=$!
          trap 'kill "$auspice_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          AUSPICE_TEST_URL=http://127.0.0.1:3100 npm run check:public
      - run: npm audit --omit=dev --audit-level=high
  desktop-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --prefix desktop
      - run: npm audit --prefix desktop --audit-level=high
